<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudFest After Party · Office</title>
<style>
  :root {
    --bg: #14151b;
    --panel: #1a1c24;
    --card: #20222c;
    --card-hover: #252835;
    --line: #2b2e3b;
    --text: #e4e5ea;
    --muted: #868ba0;
    --faint: #5b6075;
    --active: #8be9fd;
    --pass: #50fa7b;
    --changes: #ffb86c;
    --human: #ff5555;
    --merged: #bd93f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; padding: 28px 32px 8px;
  }
  .title { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .views { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; }
  .views a {
    font-size: 12px; color: var(--muted); text-decoration: none; padding: 3px 10px; border-radius: 6px;
  }
  .views a:hover { color: var(--text); }
  .views a[aria-current] { background: var(--card-hover); color: var(--text); }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--pass); margin-right: 6px; vertical-align: 1px;
  }
  .status.error { color: var(--human); }
  .status.error .dot { background: var(--human); }

  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px;
    padding: 20px 32px 32px; align-items: start;
  }
  .stage {
    position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: #0e0f14;
  }
  canvas { display: block; width: 100%; image-rendering: pixelated; cursor: default; }
  canvas.hot { cursor: pointer; }
  .tip {
    position: absolute; pointer-events: none; z-index: 2; max-width: 260px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 8px 24px -8px #000;
    opacity: 0; transition: opacity .1s;
  }
  .tip.on { opacity: 1; }
  .tip .k { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .tip .t { margin-top: 2px; }
  .tip .s { margin-top: 4px; font-family: var(--mono); font-size: 11px; color: var(--active); }

  aside { display: grid; gap: 16px; min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 10px; }
  .panel h2 {
    margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted);
  }
  .panel ul { list-style: none; margin: 0; padding: 0; }
  .panel li a {
    display: flex; gap: 8px; align-items: baseline; padding: 5px 6px; margin: 0 -6px;
    border-radius: 6px; color: inherit; text-decoration: none; font-size: 12.5px;
  }
  .panel li a:hover, .panel li a:focus-visible { background: var(--card); outline: none; }
  .panel .k { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: none; }
  .panel .x { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel .empty { color: var(--faint); font-size: 12px; padding: 2px 0 6px; }
  #log { max-height: 340px; overflow-y: auto; }
  .good { color: var(--pass); } .warn { color: var(--changes); } .stop { color: var(--human); }
  .done { color: var(--merged); }

  footer {
    padding: 0 32px 32px; font-family: var(--mono); font-size: 11px; color: var(--faint);
    display: flex; gap: 20px; flex-wrap: wrap;
  }
  footer a { color: var(--faint); }

  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    header { padding: 20px 16px 4px; }
    main { padding: 16px; }
    footer { padding: 0 16px 24px; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>CloudFest After Party</h1>
    <nav class="views" aria-label="View">
      <a href="dashboard.html">Board</a>
      <a href="office.html" aria-current="page">Office</a>
    </nav>
  </div>
  <div class="status" id="status">connecting…</div>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="office" role="img" aria-label="Pixel-art office: each factory agent works at a desk in the room for its step. The lists beside it say the same in text."></canvas>
    <div class="tip" id="tip"></div>
  </div>
  <aside>
    <section class="panel">
      <h2>On the floor</h2>
      <ul id="floor"></ul>
    </section>
    <section class="panel">
      <h2>Happening now</h2>
      <ul id="log"></ul>
    </section>
  </aside>
</main>
<footer>
  <span>/factory run</span>
  <span>/factory run &lt;n&gt;</span>
  <span>/factory &lt;anything&gt;</span>
  <span id="totals"></span>
  <span>characters: <a href="https://github.com/harishkotra/agent-office" target="_blank" rel="noopener">agent-office</a> (MIT)</span>
</footer>

<script>
// The same jobs/ the board reads, drawn as an office. Each agent has a desk in the
// room for its step, walks there when a job reaches that step and back to the lounge after.
// Between jobs they rest in the lounge or take a turn mopping its floor; Gigi, the cleaner,
// mops the lounge and the corridor all day and never takes a job.
const POLL_MS = 2000
const W = 640
const H = 400
const HALL_Y = 196 // the corridor between the two rows of rooms
const SPEED = 52 // px per second
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

// ---- Data (as dashboard.html) --------------------------------------------

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}

async function fetchFirst(url) {
  try { return (await fetchText(url)).split('\n')[0].trim() } catch { return null }
}

function verdictOf(line) {
  if (line === null) return 'pending'
  const m = line.match(/^(?:VERDICT|GATE):\s*(PASS|CHANGES|FAIL)$/)
  return m ? m[1] : 'invalid'
}

async function loadJobs() {
  let listing
  try { listing = await fetchText('jobs/') } catch { return [] }
  const doc = new DOMParser().parseFromString(listing, 'text/html')
  const ids = [...doc.querySelectorAll('a')]
    .map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('/'))
    .map((h) => h.slice(0, -1))
    .sort()
  return Promise.all(ids.map(async (id) => JSON.parse(await fetchText(`jobs/${id}/job.json`))))
}

// Reviewer verdicts of the job's current round, only while it is in review.
async function reviews(job) {
  if (job.stage !== 'review') return {}
  const dir = `jobs/${job.id}/round-${job.round}/`
  const out = {}
  await Promise.all(Object.keys(job.agents?.reviewers || {}).map(async (r) => {
    out[r] = verdictOf(await fetchFirst(`${dir}review-${r}.md`))
  }))
  return out
}

// ---- The office ----------------------------------------------------------

const ROLES = {
  intake: { name: 'intake', sprite: 0, hue: 0 },
  spec: { name: 'spec-writer', sprite: 1, hue: 0 },
  builder: { name: 'builder', sprite: 2, hue: 0 },
  code: { name: 'reviewer-code', sprite: 3, hue: 0 },
  ux: { name: 'reviewer-ux', sprite: 4, hue: 0 },
  ui: { name: 'reviewer-ui', sprite: 5, hue: 0 },
  security: { name: 'reviewer-security', sprite: 0, hue: 150 },
  approver: { name: 'approver', sprite: 1, hue: 210 },
}
const CLEANER = { name: 'Gigi', sprite: 5, hue: 180 } // not a factory agent: never in ROLES
const REVIEW_ORDER = ['code', 'ux', 'ui', 'security']
const STAGE_LABEL = {
  intake: 'Intake', 'needs-info': 'Asked the author', spec: 'Spec', build: 'Build', gate: 'Gate',
  review: 'Review', approve: 'Approve', merging: 'Merging', 'needs-human': 'Your call',
  merged: 'Merged', rejected: 'Rejected',
}

const desks = (xs, y) => xs.map((x) => ({ x, y, pose: 'type' }))
const ROOMS = {
  intake: { label: 'INTAKE', x: 0, w: 144, top: true, door: 72, floor: ['#2a2d3d', '#2d3041'], seats: desks([30, 72, 114], 104) },
  spec: { label: 'SPEC', x: 144, w: 128, top: true, door: 208, floor: ['#2b2a3e', '#2f2d43'], seats: desks([166, 208, 250], 104) },
  build: {
    label: 'BUILD · GATE', x: 272, w: 176, top: true, door: 336, floor: ['#2e2c2a', '#32302d'],
    seats: desks([292, 330, 368], 104),
    spots: [398, 416, 434].map((x) => ({ x, y: 124, pose: 'up' })),
  },
  review: {
    label: 'REVIEW', x: 448, w: 192, top: true, door: 544, aisle: 618, floor: ['#26303a', '#29343f'],
    tables: [70, 112, 154], cols: [498, 524, 550, 576],
  },
  lounge: {
    label: 'LOUNGE', x: 0, w: 176, door: 88, lane: 306, floor: ['#3a2f28', '#3f332b'], wood: true,
    spots: [
      { x: 30, y: 284, pose: 'couch' }, { x: 56, y: 284, pose: 'couch' }, { x: 82, y: 284, pose: 'couch' },
      { x: 141, y: 292, pose: 'up', coffee: true }, { x: 40, y: 334, pose: 'down' },
      { x: 120, y: 322, pose: 'down' }, { x: 152, y: 360, pose: 'left' }, { x: 26, y: 372, pose: 'right' },
      { x: 96, y: 362, pose: 'read' }, { x: 64, y: 384, pose: 'up' }, { x: 132, y: 386, pose: 'down' },
      { x: 108, y: 344, pose: 'left' },
    ],
  },
  human: { label: 'YOUR DESK', x: 176, w: 144, door: 296, lane: 350, floor: ['#3a2530', '#3e2834'] },
  shipped: { label: 'SHIPPED', x: 320, w: 144, door: 344, lane: 350, floor: ['#26332a', '#29372d'] },
  approve: { label: 'APPROVE', x: 464, w: 176, door: 488, lane: 350, floor: ['#302a3d', '#342d42'], seats: desks([522, 566, 610], 328) },
}
for (const r of Object.values(ROOMS)) {
  r.y = r.top ? 0 : 216
  r.h = r.top ? 176 : 184
  r.din = { x: r.door, y: r.top ? 164 : 252 }
  r.dout = { x: r.door, y: HALL_Y }
  if (r.lane === undefined) r.lane = r.din.y
}

// Waypoints from a room's door to a point inside it, walking around the furniture.
function route(room, t) {
  const d = room.din
  if (room.aisle) return [d, { x: room.aisle, y: d.y }, { x: room.aisle, y: t.y }, t]
  return [d, { x: d.x, y: room.lane }, { x: t.x, y: room.lane }, t]
}
function roomAt(x, y) {
  return Object.entries(ROOMS).find(([, r]) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h)?.[0]
}

// ---- Sprites -------------------------------------------------------------
// agent-office sheets: 7 columns x 3 rows of 16x32 frames. Rows face down, up, right.
// Columns 0-2 walk, 3-4 sit (and type), 5-6 sit and read.

const sheets = new Map() // "<sprite>/<hue>" -> canvas
function loadSheets() {
  const variants = new Set([...Object.values(ROLES), CLEANER].map((r) => `${r.sprite}/${r.hue}`))
  for (const h of [40, 90, 260, 300]) for (let s = 0; s < 6; s++) variants.add(`${s}/${h}`) // clones
  const images = new Map()
  for (const v of variants) {
    const [s, hue] = v.split('/').map(Number)
    if (!images.has(s)) {
      const img = new Image()
      img.src = `assets/agent-office/char_${s}.png`
      images.set(s, img)
    }
    const img = images.get(s)
    const bake = () => {
      const c = document.createElement('canvas')
      c.width = img.width
      c.height = img.height
      const g = c.getContext('2d')
      if (hue) g.filter = `hue-rotate(${hue}deg)`
      g.drawImage(img, 0, 0)
      sheets.set(v, c)
    }
    if (img.complete && img.naturalWidth) bake()
    else img.addEventListener('load', bake)
  }
}

// ---- Actors --------------------------------------------------------------

const staff = new Map() // role -> actor, always in the office
const clones = new Map() // "<role>:<job>" -> extra actor when two jobs need the same role at once
let cloneHue = 0

function makeActor(role, at, clone) {
  const r = role === 'gigi' ? CLEANER : ROLES[role]
  return {
    role, clone, sprite: r.sprite,
    hue: clone ? [40, 90, 260, 300][cloneHue++ % 4] : r.hue,
    x: at.x, y: at.y, path: [], dir: 'down', pose: 'down', walkT: 0,
    goal: null, job: null, bubble: null, idleUntil: 0, leaving: false,
    mop: null, // { until, scrubUntil } while mopping
    mopNext: Math.random() < 0.5, // idle staff alternate resting and mopping
  }
}

function sendTo(a, target) {
  if (a.goal && a.goal.x === target.x && a.goal.y === target.y) { a.goal = target; return }
  a.goal = target
  if (REDUCED) { a.x = target.x; a.y = target.y; a.path = []; return }
  const from = roomAt(a.x, a.y)
  const to = ROOMS[target.room]
  const here = { x: a.x, y: a.y }
  if (!from) {
    a.path = [{ x: a.x, y: HALL_Y }, to.dout, ...route(to, target)] // in the corridor
  } else if (from === target.room) {
    a.path = [route(to, here).reverse()[1], ...route(to, target).slice(2)]
  } else {
    const fr = ROOMS[from]
    a.path = [...route(fr, here).reverse().slice(1), fr.dout, to.dout, ...route(to, target)]
  }
}

function step(a, dt) {
  if (!a.path.length) { a.walkT = 0; return }
  const p = a.path[0]
  const dx = p.x - a.x
  const dy = p.y - a.y
  const dist = Math.hypot(dx, dy)
  const move = SPEED * dt
  if (dist > 0.01) a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')
  if (dist <= move) { a.x = p.x; a.y = p.y; a.path.shift() } else { a.x += (dx / dist) * move; a.y += (dy / dist) * move }
  a.walkT += dt
}

// ---- Mopping -------------------------------------------------------------
// Open floor only: below the couch and coffee machine, clear of the plants; the corridor for Gigi.

const MOP_MAX = 3 // idle staff mopping at once, so the lounge still looks lived-in
const LOUNGE_LANE = ROOMS.lounge.lane

function mopPoint(hall) {
  if (hall) return { x: 12 + Math.round(Math.random() * 616), y: Math.random() < 0.5 ? 188 : 204, room: 'hall', pose: 'mop' }
  return { x: 24 + Math.round(Math.random() * 128), y: 300 + Math.round(Math.random() * 88), room: 'lounge', pose: 'mop' }
}

// Straight legs between points, going round the couch and through the lounge door when needed.
function mopTo(a, p) {
  const lounge = ROOMS.lounge
  const inHall = a.y < 216
  const path = []
  if (!inHall && p.room === 'hall') {
    path.push({ x: a.x, y: LOUNGE_LANE }, { x: lounge.door, y: LOUNGE_LANE }, lounge.din, lounge.dout, { x: p.x, y: lounge.dout.y })
  } else if (inHall && p.room === 'lounge') {
    path.push({ x: a.x, y: HALL_Y }, lounge.dout, lounge.din, { x: lounge.door, y: LOUNGE_LANE }, { x: p.x, y: LOUNGE_LANE })
  } else {
    if (!inHall && a.y < 300) path.push({ x: a.x, y: LOUNGE_LANE })
    path.push({ x: p.x, y: path.length ? LOUNGE_LANE : a.y })
  }
  path.push(p)
  a.goal = p
  a.path = path
}

function startMop(a, now, ms) {
  a.mop = { until: now + ms, scrubUntil: 0 }
  mopTo(a, mopPoint(false))
}

function stopMop(a, now) {
  if (a.mop && !REDUCED) effects.dropped.push({ x: a.x + mopSide(a) * 6, y: a.y, until: now + 4000 })
  a.mop = null
}

const mopSide = (a) => (a.dir === 'left' ? -1 : 1)
function mopHead(a, t) {
  const scrub = a.mop && !a.path.length && !REDUCED ? Math.round(Math.sin(t * 11 + a.x) * 3) : 0
  return { x: Math.round(a.x + mopSide(a) * 7 + scrub), y: Math.round(a.y - 1) }
}

// Arrived: scrub a while, then on to the next point, or put the mop down when the stint is over.
function mopTick(a, now, t) {
  if (REDUCED) return
  const h = mopHead(a, t)
  wet(h.x, h.y, now)
  if (a.path.length) return
  if (!a.mop.scrubUntil) { a.mop.scrubUntil = now + 1200 + Math.random() * 1800; return }
  if (now < a.mop.scrubUntil) return
  a.mop.scrubUntil = 0
  if (now > a.mop.until) {
    stopMop(a, now)
    a.idleUntil = now + 6000 + Math.random() * 10000
    sendTo(a, freeLoungeSpot(a))
    return
  }
  const hall = a.role === 'gigi' && (a.y < 216 ? Math.random() < 0.65 : Math.random() < 0.35)
  mopTo(a, mopPoint(hall))
}

// A wet tile shines, then dries in a few seconds.
const WET_MS = 4500
function wet(x, y, now) {
  const tx = Math.floor(x / 16) * 16
  const ty = Math.floor(y / 16) * 16
  const room = roomAt(x, y)
  if (room !== 'lounge' && !(y >= 176 && y < 216)) return
  const w = effects.wet.find((m) => m.x === tx && m.y === ty)
  if (w) w.born = now
  else effects.wet.push({ x: tx, y: ty, born: now, seed: (tx * 7 + ty * 13) % 11 })
  if (effects.wet.length > 80) effects.wet.shift()
}

// ---- State from jobs -----------------------------------------------------

let jobs = []
let verdicts = new Map() // job id -> { reviewer: verdict }
const claims = new Map() // "<room>" -> [job id | null, ...] per seat
let lastSeen = null // job id -> stage, to log what changed
const effects = { rack: null, phone: 0, confetti: [], wet: [], dropped: [] }

function claim(room, n, jobId, live) {
  const list = claims.get(room) || Array(n).fill(null)
  for (let i = 0; i < n; i++) if (list[i] && !live.has(list[i])) list[i] = null
  let i = list.indexOf(jobId)
  if (i === -1) { i = list.indexOf(null); if (i !== -1) list[i] = jobId }
  claims.set(room, list)
  return i
}

function overflow(roomKey, k) {
  const r = ROOMS[roomKey]
  return { x: r.din.x + ((k % 3) - 1) * 14, y: r.din.y - 4 - Math.floor(k / 3) * 8, pose: 'up' }
}

// Who should be where for one job.
function wants(job, live) {
  const tag = `#${job.issue}`
  const one = (role, roomKey, list, pose, bubble) => {
    const i = claim(roomKey, list.length, job.id, live)
    const s = i === -1 ? overflow(roomKey, live.size) : list[i]
    return { role, job, target: { ...s, room: roomKey, pose: s.pose || pose }, bubble }
  }
  switch (job.stage) {
    case 'intake': return [one('intake', 'intake', ROOMS.intake.seats, 'type', { text: tag, typing: true })]
    case 'spec': return [one('spec', 'spec', ROOMS.spec.seats, 'type', { text: tag, typing: true })]
    case 'build': return [one('builder', 'build', ROOMS.build.seats, 'type', { text: `${tag} R${job.round}`, typing: true })]
    case 'gate': return [one('builder', 'build', ROOMS.build.spots, 'up', { text: `${tag} gate`, typing: true })]
    case 'approve': return [one('approver', 'approve', ROOMS.approve.seats, 'type', { text: tag, typing: true })]
    case 'merging': return [one('approver', 'approve', ROOMS.approve.seats, 'type', { text: `${tag} merging`, typing: true })]
    case 'review': {
      const room = ROOMS.review
      const row = claim('review', room.tables.length, job.id, live)
      const v = verdicts.get(job.id) || {}
      return Object.keys(job.agents?.reviewers || {}).map((r, n) => {
        const col = REVIEW_ORDER.indexOf(r)
        const seat = row === -1 ? overflow('review', n) : { x: room.cols[col === -1 ? n : col], y: room.tables[row], pose: 'type' }
        const done = v[r] === 'PASS' || v[r] === 'CHANGES'
        const bubble = done
          ? { text: v[r] === 'PASS' ? '✓' : '✎', tone: v[r] === 'PASS' ? '#2f9e57' : '#c9741c' }
          : { text: '', typing: true } // the table's sign says which job
        return { role: r in ROLES ? r : 'code', job, target: { ...seat, room: 'review', pose: done ? 'sit' : 'type' }, bubble }
      })
    }
    default: return []
  }
}

function freeLoungeSpot(a) {
  const taken = new Set([...staff.values(), ...clones.values()].filter((b) => b !== a && b.goal?.room === 'lounge').map((b) => `${b.goal.x},${b.goal.y}`))
  const free = ROOMS.lounge.spots.filter((s) => !taken.has(`${s.x},${s.y}`))
  const s = free[Math.floor(Math.random() * free.length)] || ROOMS.lounge.spots[0]
  return { ...s, room: 'lounge' }
}

function arrange() {
  const live = new Set(jobs.filter((j) => ['intake', 'spec', 'build', 'gate', 'review', 'approve', 'merging'].includes(j.stage)).map((j) => j.id))
  for (const [room, list] of claims) claims.set(room, list.map((id) => (live.has(id) ? id : null)))
  const want = jobs.filter((j) => live.has(j.id)).flatMap((j) => wants(j, live))

  const served = new Set()
  for (const role of Object.keys(ROLES)) {
    const mine = want.filter((w) => w.role === role)
    const s = staff.get(role)
    // Clones keep the job they came for; staff keep theirs, else take the first free one.
    for (const w of mine) {
      const c = clones.get(`${role}:${w.job.id}`)
      if (c && !c.leaving) { assign(c, w); served.add(w) }
    }
    const mineLeft = mine.filter((w) => !served.has(w))
    const pick = mineLeft.find((w) => w.job.id === s.job?.id) || mineLeft[0]
    if (pick) { assign(s, pick); served.add(pick) } else if (s.job) idle(s)
    for (const w of mine.filter((x) => !served.has(x))) {
      const c = makeActor(role, ROOMS.lounge.din, true)
      clones.set(`${role}:${w.job.id}`, c)
      assign(c, w)
      served.add(w)
    }
  }
  for (const [key, c] of clones) {
    if (!want.some((w) => `${w.role}:${w.job.id}` === key) && !c.leaving) {
      c.leaving = true
      c.job = null
      c.bubble = null
      sendTo(c, { ...ROOMS.lounge.din, room: 'lounge', pose: 'down' })
    }
  }
}

function assign(a, w) {
  stopMop(a, performance.now())
  a.job = w.job
  a.bubble = w.bubble
  sendTo(a, w.target)
}

function idle(a) {
  stopMop(a, performance.now())
  a.job = null
  a.bubble = null
  a.idleUntil = performance.now() + 4000 + Math.random() * 8000
  sendTo(a, freeLoungeSpot(a))
}

// ---- What changed --------------------------------------------------------

const log = []
function note(job, html, cls = '') {
  log.unshift({ at: new Date(), job: job?.id, html, cls })
  log.length = Math.min(log.length, 40)
}

function diff() {
  const now = new Map(jobs.map((j) => [j.id, j.stage]))
  if (lastSeen === null) {
    note(null, `Opened the office: ${jobs.length} job${jobs.length === 1 ? '' : 's'} on file.`)
  } else {
    for (const j of jobs) {
      const was = lastSeen.get(j.id)
      const tag = `<b>#${esc(j.issue)}</b>`
      if (was === j.stage) continue
      if (!was) { note(j, `${tag} walked in: ${esc(j.title)}`); continue }
      if (was === 'gate') {
        const pass = j.stage === 'review' || j.stage === 'approve'
        effects.rack = { pass, until: performance.now() + 3500 }
        note(j, `${tag} gate ${pass ? 'PASS' : 'FAIL'}`, pass ? 'good' : 'stop')
      }
      if (j.stage === 'merged') {
        burst()
        note(j, `${tag} shipped${j.pr ? ` · PR #${esc(j.pr)} merged` : ''}`, 'done')
      } else if (j.stage === 'needs-human') {
        effects.phone = performance.now() + 5000
        note(j, `${tag} is on your desk`, 'stop')
      } else if (j.stage === 'needs-info') {
        note(j, `${tag} asked the author a question`, 'warn')
      } else if (j.stage === 'rejected') {
        note(j, `${tag} rejected`, 'warn')
      } else if (was !== 'gate') {
        note(j, `${tag} ${esc(STAGE_LABEL[was] || was)} → ${esc(STAGE_LABEL[j.stage] || j.stage)}${j.stage === 'build' ? ` (round ${esc(j.round)})` : ''}`)
      }
    }
  }
  lastSeen = now
}

const seenVerdicts = new Set()
function diffVerdicts(firstPoll) {
  for (const j of jobs) {
    for (const [r, v] of Object.entries(verdicts.get(j.id) || {})) {
      const key = `${j.id}/${j.round}/${r}`
      if ((v !== 'PASS' && v !== 'CHANGES') || seenVerdicts.has(key)) continue
      seenVerdicts.add(key)
      if (!firstPoll) note(j, `<b>#${esc(j.issue)}</b> ${esc(r)} review: ${v}`, v === 'PASS' ? 'good' : 'warn')
    }
  }
}

function burst() {
  const colors = ['#50fa7b', '#8be9fd', '#bd93f9', '#ffb86c', '#ff79c6', '#f1fa8c']
  for (let i = 0; i < 70; i++) {
    effects.confetti.push({
      x: 392 + (Math.random() - 0.5) * 60, y: 280, vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 110,
      c: colors[i % colors.length], life: 2 + Math.random(),
    })
  }
}

function drawWet(now, t) {
  effects.wet = effects.wet.filter((m) => now - m.born < WET_MS)

    ctx.globalAlpha = 0.22 * life
    rect(m.x + 2, m.y + 4, 12, 8, '#8be9fd')
    rect(m.x + 4, m.y + 3, 8, 10, '#8be9fd')
    ctx.globalAlpha = 0.5 * life
    rect(m.x + 5, m.y + 6, 4, 1, '#f8f8f2')

// A mop: wooden handle from the hand down to a string head on the floor.
function drawMop(a, t) {
  const side = mopSide(a)
  const h = mopHead(a, t)
  const hx = Math.round(a.x + side * 4)
  const hy = Math.round(a.y - 15)
  const n = Math.max(Math.abs(h.x - hx), Math.abs(h.y - 2 - hy))
  for (let i = 0; i <= n; i++) rect(Math.round(hx + ((h.x - hx) * i) / n), Math.round(hy + ((h.y - 2 - hy) * i) / n), 1, 1, '#a0703c')
  rect(h.x - 3, h.y - 2, 7, 3, '#d8d8cf')
  rect(h.x - 3, h.y, 1, 1, '#a9a99f')
  rect(h.x, h.y, 1, 1, '#a9a99f')
  rect(h.x + 3, h.y, 1, 1, '#a9a99f')
}

function frameOf(a, t) {
  const walking = a.path.length > 0
  const row = { down: 0, up: 1, right: 2, left: 2 }
  if (walking) return { row: row[a.dir], col: [0, 1, 2, 1][Math.floor(a.walkT * 8) % 4], flip: a.dir === 'left' }
  const pose = a.goal?.pose || 'down'
  if (pose === 'type') return { row: 1, col: 3 + (Math.floor(t * 4 + a.x) % 2), flip: false }
  if (pose === 'sit') return { row: 1, col: 3, flip: false }
  if (pose === 'couch') return { row: 0, col: 3, flip: false }
  if (pose === 'read') return { row: 0, col: 5 + (Math.floor(t * 1.5 + a.y) % 2), flip: false }
  if (pose === 'mop') return { row: row[a.dir], col: 1, flip: a.dir === 'left' }
  return { row: row[pose] ?? 0, col: 1, flip: pose === 'left' }
}

function drawActor(a, t) {
  const f = frameOf(a, t)
  const x = Math.round(a.x - 8)
  const y = Math.round(a.y - 32)
  ctx.globalAlpha = 0.25
  rect(x + 3, Math.round(a.y) - 2, 10, 2, '#000')
  ctx.globalAlpha = 1
  const sheet = sheets.get(`${a.sprite}/${a.hue}`)
  if (sheet) {
    ctx.save()
    if (f.flip) { ctx.translate(x + 16, y); ctx.scale(-1, 1); ctx.drawImage(sheet, f.col * 16, f.row * 32, 16, 32, 0, 0, 16, 32) }
    else ctx.drawImage(sheet, f.col * 16, f.row * 32, 16, 32, x, y, 16, 32)
    ctx.restore()
  } else {
    rect(x + 4, y + 8, 8, 8, '#f1c27d')
    rect(x + 3, y + 16, 10, 14, `hsl(${a.sprite * 60 + a.hue} 50% 50%)`)
  }
  if (a.mop) drawMop(a, t)
  if (a.role === 'gigi') {
    hit(x, y, 16, 32, `<div class="k">${esc(CLEANER.name)}</div><div class="t">The cleaner. Keeps the lounge and the corridor floors shining; never takes a job.</div>`)
    return
  }
  const r = ROLES[a.role]
  const model = a.job?.agents?.reviewers?.[a.role] || (['intake', 'spec', 'builder', 'approver'].includes(a.role) ? 'opus' : '')
  hit(x, y, 16, 32, a.job
    ? tipJob(a.job, `${r.name}${model ? ` · ${model}` : ''} · ${STAGE_LABEL[a.job.stage] || a.job.stage}`)
    : `<div class="k">${esc(r.name)}${a.clone ? ' (extra)' : ''}</div><div class="t">${a.mop ? 'Mopping the lounge until a job reaches this step.' : a.goal?.coffee ? 'Getting coffee.' : 'On a break until a job reaches this step.'}</div>`,
  a.job?.id)
}

function drawBubble(a, t) {
  const b = a.bubble || (a.goal?.coffee && !a.path.length ? { text: '☕' } : null)
  if (!b) return
  const pad = b.text && b.typing ? ' ' : ''
  const dots = b.typing ? pad + '·'.repeat(1 + (Math.floor(t * 3) % 3)) : ''
  ctx.font = '600 7px ui-monospace, SFMono-Regular, Menlo, monospace'
  const label = b.text + dots
  const w = Math.ceil(ctx.measureText(b.text + (b.typing ? pad + '···' : '')).width) + 8
  const x = Math.round(a.x - w / 2)
  const y = Math.round(a.y - 46)
  rect(x - 1, y - 1, w + 2, 12, '#14151b')
  rect(x, y, w, 10, '#f8f8f2')
  rect(Math.round(a.x) - 2, y + 10, 4, 2, '#f8f8f2')
  rect(Math.round(a.x) - 1, y + 12, 2, 1, '#14151b')
  text(label, x + 4, y + 5.5, b.tone || '#14151b', 7, 'left')
}

function tipJob(j, line) {
  return `<div class="k">#${esc(j.issue)} · ${esc(j.id)}</div><div class="t">${esc(j.title)}</div><div class="s">${esc(line)}</div>`
}

let lastT = performance.now()
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000)
  lastT = now
  const t = now / 1000
  hits = []

  for (const a of [...staff.values(), ...clones.values(), gigi]) step(a, dt)
  for (const a of staff.values()) {
    if (a.job) continue
    if (a.mop) { mopTick(a, now, t); continue }
    if (!a.path.length && now > a.idleUntil) {
      const mopping = [...staff.values()].filter((b) => b.mop).length
      if (a.mopNext && mopping < MOP_MAX && !REDUCED) startMop(a, now, 10000 + Math.random() * 12000)
      else {
        a.idleUntil = now + 6000 + Math.random() * 10000
        sendTo(a, freeLoungeSpot(a))
      }
      a.mopNext = !a.mopNext
    }
  }
  mopTick(gigi, now, t)
  for (const [key, c] of clones) if (c.leaving && !c.path.length) clones.delete(key)

  ctx.clearRect(0, 0, W, H)
  drawStructure()
  drawRoomFurniture(t)
  drawWet(now, t)
  const actors = [...staff.values(), ...clones.values(), gigi].sort((a, b) => a.y - b.y)
  for (const a of actors) drawActor(a, t)
  for (const a of actors) drawBubble(a, t)

  effects.confetti = effects.confetti.filter((p) => (p.life -= dt) > 0)
  for (const p of effects.confetti) {
    p.vy += 160 * dt
    p.x += p.vx * dt
    p.y += p.vy * dt
    rect(p.x, p.y, 2, 2, p.c)
  }
  requestAnimationFrame(frame)
}

// ---- Hover and click -----------------------------------------------------

const tip = $('tip')
function hitAt(e) {
  const box = canvas.getBoundingClientRect()
  const x = ((e.clientX - box.left) / box.width) * W
  const y = ((e.clientY - box.top) / box.height) * H
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i]
    if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) return h
  }
  return null
}
canvas.addEventListener('mousemove', (e) => {
  const h = hitAt(e)
  canvas.classList.toggle('hot', !!h?.jobId)
  if (!h) { tip.classList.remove('on'); return }
  tip.innerHTML = h.tip
  const box = canvas.parentElement.getBoundingClientRect()
  const left = Math.min(e.clientX - box.left + 14, box.width - tip.offsetWidth - 8)
  const top = e.clientY - box.top + 14 + tip.offsetHeight > box.height ? e.clientY - box.top - tip.offsetHeight - 10 : e.clientY - box.top + 14
  tip.style.left = `${Math.max(8, left)}px`
  tip.style.top = `${top}px`
  tip.classList.add('on')
})
canvas.addEventListener('mouseleave', () => tip.classList.remove('on'))
canvas.addEventListener('click', (e) => {
  const h = hitAt(e)
  if (h?.jobId) location.href = `dashboard.html#job=${encodeURIComponent(h.jobId)}`
})

// ---- Side panels ---------------------------------------------------------

const jobLink = (id, inner) => id ? `<a href="dashboard.html#job=${encodeURIComponent(id)}">${inner}</a>` : `<a>${inner}</a>`

function renderPanels() {
  const order = ['needs-human', 'merging', 'approve', 'review', 'gate', 'build', 'spec', 'intake', 'needs-info']
  const open = jobs.filter((j) => order.includes(j.stage)).sort((a, b) => order.indexOf(a.stage) - order.indexOf(b.stage))
  const cls = { 'needs-human': 'stop', 'needs-info': 'warn' }
  $('floor').innerHTML = open.length
    ? open.map((j) => `<li>${jobLink(j.id, `<span class="k ${cls[j.stage] || ''}">#${esc(j.issue)} ${esc(STAGE_LABEL[j.stage] || j.stage)}</span><span class="x">${esc(j.title)}</span>`)}</li>`).join('')
    : '<li class="empty">Nobody is working. Everyone is in the lounge.</li>'
  const shipped = jobs.filter((j) => j.stage === 'merged').length
  if (shipped) $('floor').innerHTML += `<li><a><span class="k done">${shipped} shipped</span></a></li>`

  $('log').innerHTML = log.map((e) =>
    `<li>${jobLink(e.job, `<span class="k">${e.at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span><span class="x ${e.cls}">${e.html}</span>`)}</li>`).join('')

  const running = jobs.filter((j) => ['intake', 'spec', 'build', 'gate', 'review', 'approve', 'merging'].includes(j.stage)).length
  const cost = jobs.reduce((sum, j) => sum + Number(j.cost_usd), 0)
  $('totals').textContent = `${running} running · $${cost.toFixed(2)} API-equivalent`
}

async function poll() {
  const status = $('status')
  try {
    jobs = await loadJobs()
    const first = lastSeen === null
    verdicts = new Map(await Promise.all(jobs.map(async (j) => [j.id, await reviews(j)])))
    diff()
    diffVerdicts(first)
    arrange()
    if (first) for (const a of [...staff.values(), ...clones.values()]) { a.x = a.goal.x; a.y = a.goal.y; a.path = [] }
    renderPanels()
    status.className = 'status'
    status.innerHTML = `<span class="dot"></span>jobs/ · ${new Date().toLocaleTimeString()}`
  } catch (err) {
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  }
}

loadSheets()
for (const role of Object.keys(ROLES)) {
  const a = makeActor(role, ROOMS.lounge.spots[0], false)
  const s = freeLoungeSpot(a)
  a.x = s.x
  a.y = s.y
  a.goal = s
  a.idleUntil = performance.now() + Math.random() * 6000
  staff.set(role, a)
}
const gigi = makeActor('gigi', { x: 100, y: 312 }, false)
gigi.mop = { until: Infinity, scrubUntil: 0 }
gigi.goal = { x: gigi.x, y: gigi.y, room: 'lounge', pose: 'mop' }
resize()
new ResizeObserver(resize).observe(canvas.parentElement)
requestAnimationFrame(frame)
poll()
setInterval(poll, POLL_MS)
</script>
</body>
